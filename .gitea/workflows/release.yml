# 推 v* 标签 → 建 Release → Windows runner 打 Windows 安装包和 Android APK、
# Linux runner 打 deb 和 AppImage，都传到这个 Release。
# Chat 服务端读最新 Release 给客户端做在线更新（server/src/client_update.rs）。
# runner 安装见 docs/release-runners.md。
#
# 不用 actions/checkout：host 模式下它要从 github.com 拉，内网不一定通。仓库是公开的，直接 git fetch。
name: release

on:
  push:
    tags: ["v*"]

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  release:
    runs-on: linux
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: 检出
        run: |
          git init -q . && git fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "+${{ gitea.ref }}:${{ gitea.ref }}"
          git checkout -q "${{ gitea.ref_name }}"
      - name: 标签与 tauri.conf.json 版本一致
        run: |
          ver=$(python3 -c 'import json;print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')
          [ "v$ver" = "${{ gitea.ref_name }}" ] || { echo "标签 ${{ gitea.ref_name }} 与 version $ver 不一致"; exit 1; }
      - name: 建 Release（标签说明 = 更新说明）
        id: create
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          body=$(git tag -l --format='%(contents)' "${{ gitea.ref_name }}")
          json=$(TAG="${{ gitea.ref_name }}" BODY="$body" python3 -c 'import json,os;print(json.dumps({"tag_name":os.environ["TAG"],"name":os.environ["TAG"],"body":os.environ["BODY"]}))')
          id=$(curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$json" "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          echo "id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: release
    runs-on: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 检出
        run: |
          git init -q .; git fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "+${{ gitea.ref }}:${{ gitea.ref }}"
          git checkout -q "${{ gitea.ref_name }}"
          "VERSION=$('${{ gitea.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - name: Windows 安装包
        working-directory: app
        # 本地打包没有私钥，签名只在 CI 打开
        run: pnpm tauri build --config src-tauri/tauri.updater.conf.json
      - name: Android APK
        working-directory: app
        run: |
          # 固定签名：换了签名的 APK 覆盖不了旧版
          New-Item -ItemType Directory -Force "$HOME/.android" | Out-Null
          [IO.File]::WriteAllBytes("$HOME/.android/debug.keystore", [Convert]::FromBase64String("${{ secrets.ANDROID_DEBUG_KEYSTORE }}"))
          pnpm tauri android build --apk --debug --target aarch64
      - name: 上传
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          $url = "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases/${{ needs.release.outputs.id }}/assets"
          $nsis = "app/src-tauri/target/release/bundle/nsis"
          $files = @(
            @("$nsis/Chat_${env:VERSION}_x64-setup.exe", "Chat_${env:VERSION}_x64-setup.exe"),
            @("$nsis/Chat_${env:VERSION}_x64-setup.exe.sig", "Chat_${env:VERSION}_x64-setup.exe.sig"),
            # 输出目录随 Gradle 配置变（universal / arm64），按扩展名找
            @((Get-ChildItem app/src-tauri/gen/android/app/build/outputs/apk -Recurse -Filter *.apk | Select-Object -First 1).FullName, "Chat_${env:VERSION}_arm64.apk")
          )
          foreach ($f in $files) {
            curl.exe -sSf -H "Authorization: token $env:TOKEN" -F "attachment=@$($f[0])" "${url}?name=$($f[1])"
            if ($LASTEXITCODE) { throw "上传 $($f[1]) 失败" }
          }

  linux:
    needs: release
    runs-on: linux
    env:
      # linuxdeploy 本身是 AppImage，解开运行就不依赖 FUSE
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: 检出
        run: |
          git init -q . && git fetch -q --depth 1 "${{ gitea.server_url }}/${{ gitea.repository }}.git" "+${{ gitea.ref }}:${{ gitea.ref }}"
          git checkout -q "${{ gitea.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - name: deb 和 AppImage
        working-directory: app
        run: pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.updater.conf.json
      - name: 上传
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          url="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/releases/${{ needs.release.outputs.id }}/assets"
          b=app/src-tauri/target/release/bundle
          for f in $b/deb/*.deb $b/deb/*.deb.sig $b/appimage/*.AppImage $b/appimage/*.AppImage.sig; do
            curl -sSf -H "Authorization: token $TOKEN" -F "attachment=@$f" "$url?name=$(basename "$f")"
          done
