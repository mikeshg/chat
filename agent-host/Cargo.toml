[package]
name = "agent-host"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
# Agent A13：本地 MCP 服务（axum）+ 工具调用回拨服务端（reqwest，rustls）
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
# Agent A07：登记表安装（zip / tar.gz、sha256）
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
# Agent A05：图片附件走 ACP image 块（base64 内联）；产出文件上传按扩展名猜 MIME
base64 = "0.22"
mime_guess = "2"
# Agent A29：内置 agent 底座（LLM Provider + 运行循环 + 工具/钩子；edition 2024）
agent = { git = "http://192.168.6.210:3000/xiefan/agent.git", tag = "v0.1.0" }
schemars = "1"
async-trait = "0.1"
regex = "1"

[dev-dependencies]
anyhow = "1"
tracing-subscriber = "0.3"
