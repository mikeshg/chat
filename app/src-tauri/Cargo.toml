[package]
name = "chat-app"
version = "0.1.0"
edition = "2021"
description = "Chat client"

[lib]
name = "chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# tauri::generate_context! 展开后直接引用 ::serde_json
serde_json = "1"

# 开机自启只有桌面平台（Android 不编译这个插件）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# 在线更新（Windows 安装包；Android 走下载 APK）
tauri-plugin-updater = "2"

# Linux 托盘直连 tray-icon/libayatana-appindicator，拿 AppIndicator* 绑定中键激活目标
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = "0.24"
muda = "0.19"
gtk = "0.18"
libloading = "0.7"
