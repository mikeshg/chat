services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 只给本机开发用；服务端走 compose 内网，不需要对外开放
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      # 必填：在本目录 .env 里写 JWT_SECRET=<openssl rand -hex 32>，没设置服务端拒绝启动
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 8080
      APP_DIST: /app/dist
      FILES_DIR: /data/files
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
      # 挂在反向代理后面才设 1（见 README）
      TRUST_PROXY: ${TRUST_PROXY:-}
      # 客户端在线更新：默认 xie-fan/chat（GitHub Release）；"off" 关闭；后台设置里也能改
      CLIENT_UPDATE_REPO: ${CLIENT_UPDATE_REPO:-}
      # 可选：读 GitHub release 用的 token / 更新请求走的代理
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLIENT_UPDATE_PROXY: ${CLIENT_UPDATE_PROXY:-}
      # 测试/GHE 才用：GitHub API 地址，默认 https://api.github.com
      GITHUB_API_BASE: ${GITHUB_API_BASE:-}
      # 服务器对外地址（public_url）不走环境变量，在客户端「管理」后台设置；
      # 默认 https://chat.287152.xyz，是推送 Click 与客户端更新下载地址的前缀
      # （显式设为空 = 更新下载地址按请求 Host 拼）
    volumes:
      - chat-files:/data/files
    ports:
      - "28080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chat-files:
