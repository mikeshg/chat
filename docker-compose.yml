services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # 只给本机开发用；服务端走 compose 内网，不需要对外开放
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      # 必填：在本目录 .env 里写 JWT_SECRET=<openssl rand -hex 32>，没设置服务端拒绝启动
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 8080
      APP_DIST: /app/dist
      FILES_DIR: /data/files
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    volumes:
      - chat-files:/data/files
    ports:
      - "28080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chat-files:
