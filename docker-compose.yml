services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 8080
      APP_DIST: /app/dist
      FILES_DIR: /data/files
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-25}
    volumes:
      - chat-files:/data/files
    ports:
      - "28080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chat-files:
